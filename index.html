<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俗常</title>
<meta name="description" content="俗常的个人主页">
<style>
  :root {
    --paper: #f7f4ee;
    --ink: #2b2b2b;
    --ink-light: #7a776f;
    --accent: #a63d2f;
    --line: #dcd7cc;
    --face: #f2eee5;
    --face-5: #e9ddcf;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; background: none; border: none; color: inherit; cursor: pointer; }

  /* ================= 主界面：只有球和名字 ================= */
  #home {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,255,255,.5), transparent 62%),
      radial-gradient(ellipse at center, transparent 55%, rgba(43,43,43,.05) 100%),
      var(--paper);
  }
  #ball { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 四角常驻入口 */
  .corner {
    position: absolute; z-index: 3;
    font-size: 15px; letter-spacing: 6px;
    color: var(--ink-light); cursor: pointer;
    padding: 28px 36px; user-select: none;
    display: flex; align-items: center; gap: 10px;
    transition: color .25s;
    opacity: 0; animation: cornerIn 1s ease .4s forwards;
  }
  @keyframes cornerIn { to { opacity: 1; } }
  .corner:hover { color: var(--accent); }
  .corner::before {
    content: ""; width: 6px; height: 6px; flex: none;
    background: var(--accent); transform: rotate(45deg);
    opacity: .75;
  }
  .corner.c-tl { top: 0; left: 0; }
  .corner.c-tr { top: 0; right: 0; }
  .corner.c-bl { bottom: 0; left: 0; }
  .corner.c-br { bottom: 0; right: 0; }
  .hero-hint { bottom: 40px; }
  .hero-name {
    font-size: clamp(56px, 10vw, 120px);
    letter-spacing: 0.28em; margin-left: 0.28em;
    font-weight: 600; user-select: none;
  }
  .hero-sub { margin-top: 14px; font-size: 14px; letter-spacing: 8px; color: var(--ink-light); }
  .hero-seal {                        /* 名字下的朱印 */
    margin-top: 34px;
    width: 34px; height: 34px;
    background: var(--accent); color: #f7f4ee;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; letter-spacing: 0;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1.5px rgba(247,244,238,.35);
    writing-mode: vertical-rl;
    opacity: .88;
  }
  .hero-hint {
    position: absolute; bottom: 40px; z-index: 2; pointer-events: none;
    font-size: 12px; letter-spacing: 6px; color: var(--ink-light);
    opacity: .75; animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .4; } 50% { opacity: .85; } }

  /* 主界面退场 */
  #home.away {
    opacity: 0; transform: scale(1.06);
    pointer-events: none;
    transition: opacity .5s ease, transform .5s ease;
  }

  /* ================= 通用整屏层 ================= */
  .screen {
    position: fixed; inset: 0; z-index: 10;
    background: var(--paper);
    overflow-y: auto;
    opacity: 0; visibility: hidden; transform: translateY(26px);
    transition: opacity .45s ease, transform .45s ease, visibility .45s;
  }
  .screen.open { opacity: 1; visibility: visible; transform: translateY(0); }
  .back {
    position: sticky; top: 0; z-index: 5;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 20px 6vw; font-size: 15px; letter-spacing: 4px;
    color: var(--ink-light);
    background: rgba(247, 244, 238, 0.9); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    transition: color .25s;
    width: 100%;
  }
  .back:hover { color: var(--accent); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 60px 24px 110px; }

  /* ================= 入口界面：四枚圆印 ================= */
  #panel .wrap {
    max-width: 920px; padding-top: 0;
    display: flex; flex-direction: column;
    justify-content: center; min-height: 100%;
  }
  .cards {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(28px, 6vw, 64px);
  }
  .card {
    position: relative;
    width: clamp(104px, 16vw, 148px); aspect-ratio: 1;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform .35s ease;
  }
  .card:hover { transform: translateY(-8px); }
  .card:active { transform: translateY(-3px); }
  .card::before {                     /* 内环：双环圆印 */
    content: ""; position: absolute; inset: 8px;
    border-radius: 50%;
    border: 1px solid currentColor; opacity: .35;
    pointer-events: none;
  }
  .card .icon { width: 44%; }
  .card .icon svg { display: block; width: 100%; height: auto; }
  /* ---------- 入场动画（screen 打开时逐个淡入，不占 transform 以免影响 hover） ---------- */
  .anim { opacity: 0; }
  .screen.open .anim { animation: fadeIn .6s ease forwards; animation-delay: var(--d, 0s); }
  @keyframes fadeIn { to { opacity: 1; } }
  /* 四枚圆印各自的气质（淡色圆底） */
  .card-debate  { background: #f0e3dd; color: #7c2d20; }   /* 朱 */
  .card-daily   { background: #e5ebe8; color: #2f4f4a; }   /* 黛 */
  .card-contact { background: #efe9dc; color: #6b5b2e; }   /* 墨金 */
  .card-essay   { background: #e9eee1; color: #4a5d3a; }   /* 竹青 */

  /* ================= 图片页（辩论 / 日常共用） ================= */
  .sec-title {
    font-size: 24px; letter-spacing: 10px; margin-bottom: 48px;
    display: flex; align-items: center; gap: 18px;
  }
  .sec-title::before {                 /* 标题前的朱红小印 */
    content: ""; width: 9px; height: 9px; flex: none;
    background: var(--accent); transform: rotate(45deg);
  }
  .sec-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .pic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .pic-grid.stack { grid-template-columns: 1fr; }   /* 横图上下排、完整展示 */
  .pic {
    border: 1px solid var(--line); background: #fdfcf9;
    transition: transform .3s, box-shadow .3s;
    display: block;
  }
  .pic:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(43,43,43,.09); }
  .pic-img { overflow: hidden; background: #f2eee5; }
  .pic-img img {
    width: 100%; height: auto; display: block;      /* 不裁剪，完整显示 */
    transition: transform .5s ease;
  }
  .pic:hover .pic-img img { transform: scale(1.02); }
  .pic .cap {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px; border-top: 1px solid var(--line);
  }
  .pic .cap::before, .pic .cap::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .pic .cap .name { letter-spacing: 6px; font-size: 15px; white-space: nowrap; }
  .pic .cap .dm {
    width: 6px; height: 6px; background: var(--accent);
    transform: rotate(45deg); flex: none;
  }

  /* ================= 联系 ================= */
  .essay-list { display: flex; flex-direction: column; }
  .essay {
    padding: 26px 4px;
    border-bottom: 1px dashed var(--line);
  }
  .essay .date {
    font-size: 12px; letter-spacing: 3px;
    color: var(--ink-light); margin-bottom: 10px;
  }
  .essay p { font-size: 17px; line-height: 2; }
  /* ================= 名字来源 ================= */
  .name-box { text-align: center; padding-top: 60px; }
  .name-box .n-title {
    font-size: clamp(56px, 9vw, 88px);
    letter-spacing: .3em; margin-left: .3em; font-weight: 600;
  }
  .name-box .n-quote { margin-top: 46px; font-size: 20px; line-height: 2.4; letter-spacing: 4px; }
  .name-box .n-sep {
    width: 9px; height: 9px; margin: 44px auto;
    background: var(--accent); transform: rotate(45deg);
  }
  .name-box .n-note { font-size: 14px; color: var(--ink-light); letter-spacing: 3px; }
  .contact-box { text-align: center; padding-top: 46px; }
  .contact-box .end { font-size: 22px; letter-spacing: 12px; margin-bottom: 44px; }
  .contact-box .wx { font-size: 20px; letter-spacing: 3px; }
  .contact-box .wx .id { color: var(--accent); }
  .contact-box .tip { margin-top: 14px; font-size: 13px; color: var(--ink-light); }

  @media (max-width: 900px) {
    .cards { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    .pic-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ============ 主界面 ============ -->
<div id="home" title="点一下进入">
  <canvas id="ball"></canvas>
  <a class="corner c-tl" data-corner="debate">辩论</a>
  <a class="corner c-tr" data-corner="daily">日常</a>
  <a class="corner c-bl" data-corner="essay">随笔</a>
  <a class="corner c-br" data-corner="contact">联系</a>
  <div class="hero-hint">拖动旋转 · 点击环上的图或字进入</div>
</div>

<!-- ============ 辩论 ============ -->
<div class="screen" id="page-debate">
  <button class="back" data-home>← 俗常</button>
  <div class="wrap">
    <div class="pic-grid">
      <a class="pic anim" style="--d:0.15s" href="https://search.bilibili.com/all?keyword=%E7%86%8A%E6%B5%A9%20%E6%84%8F%E4%B9%89%E7%9A%84%E5%BB%BA%E6%9E%84" target="_blank" rel="noopener">
        <div class="pic-img"><img src="xionghao-kunlun.png" alt="熊浩"></div>
        <div class="cap"><span class="dm"></span><span class="name">昆仑的灵芝</span><span class="dm"></span></div>
      </a>
      <a class="pic anim" style="--d:0.27s" href="https://search.bilibili.com/all?keyword=%E6%96%B0%E5%9B%BD%E8%BE%A9%20%E9%BB%84%E6%89%A7%E4%B8%AD%20%E7%86%8A%E6%B5%A9%20%E9%95%BF%E5%AE%89%E7%9A%84%E8%8D%94%E6%9E%9C" target="_blank" rel="noopener">
        <div class="pic-img"><img src="xionghao-lizhi.png" alt="熊浩"></div>
        <div class="cap"><span class="dm"></span><span class="name">长安的荔枝</span><span class="dm"></span></div>
      </a>
    </div>
  </div>
</div>

<!-- ============ 日常 ============ -->
<div class="screen" id="page-daily">
  <button class="back" data-home>← 俗常</button>
  <div class="wrap">
    <div class="pic-grid stack">
      <div class="pic anim" style="--d:0.05s">
        <div class="pic-img"><img src="yuhuan.png" alt="玉环"></div>
        <div class="cap"><span class="dm"></span><span class="name">玉环</span><span class="dm"></span></div>
      </div>
      <div class="pic anim" style="--d:0.17s">
        <div class="pic-img"><img src="zhuangxiaoyu.png" alt="庄小鱼"></div>
        <div class="cap"><span class="dm"></span><span class="name">庄小鱼</span><span class="dm"></span></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 随笔 ============ -->
<div class="screen" id="page-essay">
  <button class="back" data-home>← 俗常</button>
  <div class="wrap">
    <div class="sec-title anim" style="--d:0.05s">随笔</div>
    <div class="essay-list">
      <!-- 想加一条就复制一个 <div class="essay"> 块：日期 + 内容 -->
      <div class="essay anim" style="--d:0.15s">
        <div class="date">2026.10.24</div>
        <p>此处放你想说的话。想写多长都行，一两句也可以。</p>
      </div>
      <div class="essay anim" style="--d:0.27s">
        <div class="date"></div>
        <p>主页建好了。是个开始。</p>
      </div>
    </div>
  </div>
</div>

<!-- ============ 名字来源 ============ -->
<div class="screen" id="page-name">
  <button class="back" data-home>← 俗常</button>
  <div class="wrap name-box anim" style="--d:0.1s">
    <div class="n-title">俗常</div>
    <div class="n-quote">
      <p>生而热烈，藏与俗常；</p>
      <p>心有山海，静而不争。</p>
    </div>
    <div class="n-sep"></div>
    <p class="n-note">名字取自这句话。</p>
  </div>
</div>

<!-- ============ 联系 ============ -->
<div class="screen" id="page-contact">
  <button class="back" data-home>← 俗常</button>
  <div class="wrap contact-box anim" style="--d:0.1s">
    <div class="end">静而不争</div>
    <div class="wx">微信：<span class="id">俗常</span></div>
    <!-- 如果微信号不是“俗常”，改上面 span 里的字 -->
    <p class="tip">加我时请注明来意</p>
  </div>
</div>

<script>
/* ================= 富勒烯几何（截角二十面体：60 顶点 / 90 边 / 12 五元环 + 20 六元环） ================= */
function makeFullerene() {
  const phi = (1 + Math.sqrt(5)) / 2;
  const base = [[0, 1, 3*phi], [1, 2+phi, 2*phi], [2, 1+2*phi, phi]];
  const verts = [], seen = new Set();
  const add = (x, y, z) => {
    const key = [x,y,z].map(v => v.toFixed(4)).join(',');
    if (!seen.has(key)) { seen.add(key); verts.push([x, y, z]); }
  };
  // 只取偶（循环）排列——全排列会得到 120 个顶点的错误结构
  const cyc = p => { const [a,b,c] = p; return [[a,b,c],[b,c,a],[c,a,b]]; };
  for (const p of base) for (const q of cyc(p))
    for (const sx of [1,-1]) for (const sy of [1,-1]) for (const sz of [1,-1])
      add(q[0]*sx, q[1]*sy, q[2]*sz);

  const d2 = (a,b) => (a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2;
  const edges = [], adj = verts.map(() => []);
  for (let i = 0; i < verts.length; i++)
    for (let j = i+1; j < verts.length; j++)
      if (Math.abs(d2(verts[i], verts[j]) - 4) < 1e-6) { edges.push([i,j]); adj[i].push(j); adj[j].push(i); }

  /* ---- 面提取：32 个面法向（五元环法向=正二十面体顶点方向，六元环法向=正十二面体顶点方向），
         平面聚类 + 边相连校验 ---- */
  const sub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
  const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const norm = a => { const l = Math.hypot(...a); return a.map(v => v/l); };

  const normals = [];
  for (const p of cyc([0, 1, phi]))                       // 12 个五元环法向
    for (const sx of [1,-1]) for (const sy of [1,-1]) for (const sz of [1,-1])
      normals.push(norm([p[0]*sx, p[1]*sy, p[2]*sz]));
  for (const s of [1,-1]) for (const t of [1,-1]) for (const u of [1,-1])
    normals.push(norm([s, t, u]));                         // 六元环法向族一
  for (const p of cyc([0, phi, 1/phi]))                    // 六元环法向族二
    for (const sx of [1,-1]) for (const sy of [1,-1]) for (const sz of [1,-1])
      normals.push(norm([p[0]*sx, p[1]*sy, p[2]*sz]));

  const edgeSet = new Set(edges.map(([a,b]) => a < b ? a+'-'+b : b+'-'+a));
  const isEdge = (a,b) => edgeSet.has(Math.min(a,b)+'-'+Math.max(a,b));
  const faceMap = new Map();
  for (const n of normals) {
    const dots = verts.map(v => dot(v, n));
    const groups = {};
    dots.forEach((d, i) => {
      const k = Math.round(d * 100);
      (groups[k] = groups[k] || []).push(i);
    });
    for (const g of Object.values(groups)) {
      if (g.length !== 5 && g.length !== 6) continue;
      const c = [0,1,2].map(k => g.reduce((s,v) => s + verts[v][k], 0) / g.length);
      const e1 = norm(sub(verts[g[0]], c)), e2 = cross(n, e1);
      const ang = v => { const d = sub(verts[v], c); return Math.atan2(dot(d,e2), dot(d,e1)); };
      const s = g.slice().sort((p,q) => ang(p) - ang(q));
      let ok = true;
      for (let k = 0; k < s.length; k++)
        if (!isEdge(s[k], s[(k+1) % s.length])) { ok = false; break; }
      if (ok) faceMap.set([...s].sort((a,b)=>a-b).join(','), s);
    }
  }
  return { verts, edges, faces: [...faceMap.values()] };
}

/* ================= 画布渲染（可拖拽自转） ================= */
function attachBall(canvas, opts) {
  const ctx = canvas.getContext('2d');
  const { verts, faces } = makeFullerene();
  let rx = 0.35, ry = 0.25, trx = 0.35, try_ = 0.25;   // 当前角与目标角（缓动逼近）
  let vy = 0.0035, vx = 0.0012;
  let dragging = false, moved = false, lastX = 0, lastY = 0;
  let lastPts = null, lastRect = null;

  // 面内容：一对一、随机分配到不同的面上，空着的面保持素色，留作以后添加
  const photos = (opts.photos || []).map(p => {
    const im = new Image(); im.src = p.src; return { im, page: p.page };
  });
  const chars = opts.chars || [];
  const shuffled = arr => arr.slice().sort(() => Math.random() - 0.5);
  const hexFaces = shuffled(faces.map((f, i) => i).filter(i => faces[i].length === 6));
  const pentFaces = shuffled(faces.map((f, i) => i).filter(i => faces[i].length === 5));
  const faceContent = faces.map((f, i) => {
    const h = hexFaces.indexOf(i);
    if (f.length === 6 && h > -1 && h < photos.length) {
      const p = photos[h];
      return { type: 'img', im: p.im, page: p.page };
    }
    const p5 = pentFaces.indexOf(i);
    if (f.length === 5 && p5 > -1 && p5 < chars.length) {
      const c = chars[p5];
      return { type: 'char', ch: c.ch, page: c.page };
    }
    return null;
  });

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * dpr; canvas.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function draw() {
    const r = canvas.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const R = Math.min(r.width, r.height) * opts.scale;
    const cy1 = Math.cos(ry), sy1 = Math.sin(ry);
    const cx1 = Math.cos(rx), sx1 = Math.sin(rx);
    const proj = ([x, y, z]) => {
      let X = x * cy1 + z * sy1, Z = -x * sy1 + z * cy1;
      let Y = y * cx1 - Z * sx1; Z = y * sx1 + Z * cx1;
      return { x: cx + X * R / 4.6, y: cy + Y * R / 4.6, z: Z };
    };
    const pts = verts.map(proj);
    ctx.clearRect(0, 0, r.width, r.height);
    lastPts = pts; lastRect = r;
    const order = faces
      .map((f, i) => ({ i, z: f.reduce((s, v) => s + pts[v].z, 0) / f.length }))
      .sort((a, b) => a.z - b.z);
    for (const { i } of order) {
      const f = faces[i], fc = faceContent[i];
      const fp = f.map(v => pts[v]);
      ctx.beginPath();
      ctx.moveTo(fp[0].x, fp[0].y);
      for (let k = 1; k < fp.length; k++) ctx.lineTo(fp[k].x, fp[k].y);
      ctx.closePath();
      const isFront = fp.reduce((s, p) => s + p.z, 0) / fp.length > 0;
      const hasContent = (opts.photos && opts.photos.length) || (opts.chars && opts.chars.length);
      if (hasContent && fc && isFront) {
        if (fc.type === 'img' && fc.im && fc.im.complete && fc.im.naturalWidth) {
          // 仿射贴图：以“世界竖直方向”在面上的投影定图片的上下，图片永远头朝上贴在球面
          const c3 = [0,1,2].map(k => f.reduce((s, v) => s + verts[v][k], 0) / f.length);
          const nLen = Math.hypot(...c3);
          const n3 = c3.map(v => v / nLen);
          // 屏幕“上”在世界坐标里是 -Y（投影 y = cy + Y*scale，canvas 的 y 向下）
          const WUP = [0, -1, 0];
          const dn = WUP[0]*n3[0] + WUP[1]*n3[1] + WUP[2]*n3[2];
          const upP = WUP.map((v, k) => v - dn * n3[k]);
          const upLen = Math.hypot(...upP);
          let e1, e2;
          if (upLen > 0.25) {
            const uHat = upP.map(v => v / upLen);   // 面上的“上”
            e2 = uHat.map(v => -v);                 // 图片的“下”轴
            e1 = [ e2[1]*n3[2]-e2[2]*n3[1], e2[2]*n3[0]-e2[0]*n3[2], e2[0]*n3[1]-e2[1]*n3[0] ]; // 右 = 下 × 法向
          } else {
            // 极点附近的面：退回用顶点方向
            e1 = verts[f[0]].map((x, k) => x - c3[k]);
            const eLen2 = Math.hypot(...e1);
            e1 = e1.map(v => v / eLen2);
            e2 = [n3[1]*e1[2]-n3[2]*e1[1], n3[2]*e1[0]-n3[0]*e1[2], n3[0]*e1[1]-n3[1]*e1[0]];
          }
          const circum = Math.max(...f.map(v =>
            Math.hypot(verts[v][0]-c3[0], verts[v][1]-c3[1], verts[v][2]-c3[2]))) * 1.04;
          const P0 = proj(c3);
          const Pu = proj(c3.map((x, k) => x + e1[k] * circum));
          const Pv = proj(c3.map((x, k) => x + e2[k] * circum));
          ctx.save(); ctx.clip();
          ctx.transform(Pu.x - P0.x, Pu.y - P0.y, Pv.x - P0.x, Pv.y - P0.y, P0.x, P0.y);
          ctx.drawImage(fc.im, -1, -1, 2, 2);
          ctx.restore();
        } else if (fc.type === 'char' && fc.ch) {
          // 朱文印：素白底 + 细朱圆圈 + 朱红楷体竖排
          ctx.fillStyle = '#fbf8f1';
          ctx.fill();
          const cx0 = fp.reduce((s, p) => s + p.x, 0) / fp.length;
          const cy0 = fp.reduce((s, p) => s + p.y, 0) / fp.length;
          const circum0 = Math.min(...fp.map(p => Math.hypot(p.x - cx0, p.y - cy0)));
          const inr = circum0 * Math.cos(Math.PI / f.length);   // 面内切圆半径
          ctx.strokeStyle = '#a63d2f';
          ctx.lineWidth = Math.max(1, opts.lineW || 1);
          ctx.beginPath(); ctx.arc(cx0, cy0, inr * 0.92, 0, Math.PI * 2); ctx.stroke();
          const chs = [...fc.ch];
          const fs = Math.min(inr * 0.62, inr * 1.55 / chs.length);
          ctx.fillStyle = '#a63d2f';
          ctx.font = fs + 'px "KaiTi","STKaiti","Noto Serif SC","SimSun",serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          chs.forEach((ch, k) => {
            ctx.fillText(ch, cx0, cy0 + (k - (chs.length - 1) / 2) * fs * 1.15);
          });
        } else {
          ctx.fillStyle = f.length === 5 ? opts.face5 : opts.face6;
          ctx.fill();
        }
      } else {
        // 背面或没有内容：素色
        ctx.fillStyle = f.length === 5 ? opts.face5 : opts.face6;
        ctx.fill();
      }
      ctx.strokeStyle = opts.edge;
      ctx.lineWidth = opts.lineW || 1;
      ctx.stroke();
    }
  }

  window.__ballDraw = draw;   // 调试探针（也便于无动画环境手动重绘）
  // 右键：把正对着观众的面（优先有内容的面）转到正中央
  function snapToFront() {
    if (!lastPts) return;
    let best = -1, bestZ = -1, bestC = -1, bestCZ = -1;
    faces.forEach((f, i) => {
      const z = f.reduce((s, v) => s + lastPts[v].z, 0) / f.length;
      if (z > bestZ) { bestZ = z; best = i; }
      if (faceContent[i] && z > 0 && z > bestCZ) { bestCZ = z; bestC = i; }
    });
    const f = faces[bestC > -1 ? bestC : best];
    const c3 = [0,1,2].map(k => f.reduce((s, v) => s + verts[v][k], 0) / f.length);
    const nLen = Math.hypot(...c3);
    const nx = c3[0] / nLen, ny = c3[1] / nLen, nz = c3[2] / nLen;
    trx = Math.atan2(ny, Math.hypot(nx, nz));
    let ty = Math.atan2(-nx, nz);
    // 就近转过去（不绕远路）
    while (ty - try_ > Math.PI) ty -= 2 * Math.PI;
    while (ty - try_ < -Math.PI) ty += 2 * Math.PI;
    try_ = ty;
  }
  canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    snapToFront();
  });
  // 滚轮：平滑滚动（目标角 + 缓动）
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    trx += e.deltaY * 0.0018;
  }, { passive: false });

  (function loop() {
    if (!dragging) {
      rx += (trx - rx) * 0.22;
      ry += (try_ - ry) * 0.22;
      if (Math.abs(trx - rx) < 0.0008 && Math.abs(try_ - ry) < 0.0008) { trx += vx; try_ += vy; }
    }
    draw();
    requestAnimationFrame(loop);
  })();

  canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;            // 只有左键拖拽
    dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    if (Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY) > 3) moved = true;
    try_ += (e.clientX - lastX) * 0.008;
    trx += (e.clientY - lastY) * 0.008;
    ry = try_; rx = trx;                      // 拖拽时零延迟跟随
    lastX = e.clientX; lastY = e.clientY;
  });
  canvas.addEventListener('pointerup', e => {
    dragging = false;
    if (moved || !lastPts || !opts.onNav) return;
    // 命中检测：从最靠前的面往后找，点到带内容的面就跳转
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const hits = faces
      .map((f, i) => ({ i, z: f.reduce((s, v) => s + lastPts[v].z, 0) / f.length }))
      .sort((a, b) => b.z - a.z);
    for (const { i } of hits) {
      const fp = faces[i].map(v => lastPts[v]);
      if (!inPoly(px, py, fp)) continue;
      const fc = faceContent[i];
      if (fc && fc.page) opts.onNav(fc.page);
      return;
    }
  });
  function inPoly(x, y, fp) {   // 射线法判断点是否在多边形内
    let inside = false;
    for (let a = 0, b = fp.length - 1; a < fp.length; b = a++) {
      if ((fp[a].y > y) !== (fp[b].y > y) &&
          x < (fp[b].x - fp[a].x) * (y - fp[a].y) / (fp[b].y - fp[a].y) + fp[a].x)
        inside = !inside;
    }
    return inside;
  }
}

const css = getComputedStyle(document.documentElement);
attachBall(document.getElementById('ball'), {
  scale: 0.9, lineW: 1,
  // 一对一：目前只放熊浩的一张（点击进辩论页，那页是两张图的介绍）。
  // 以后长了新内容，往 photos / chars 各加一条即可，第 N 条贴到第 N 个六元环 / 五元环上，其余留空。
  photos: [
    { src: 'xionghao-kunlun.png', page: 'debate' },
    { src: 'benke.png', page: null },       // 本科（暂无对应页面，点了不跳转）
    { src: 'wanxiangqi.png', page: 'daily' }, // 万象棋 → 日常页（玉环、庄小鱼）
    { src: 'photo5.png', page: null },        // 新增图片（对应界面待定）
    { src: 'photo6.png', page: null }         // 新增图片（对应界面待定）
  ],
  chars: [
    { ch: '俗常', page: 'name' },
    { ch: '26', page: null }                // 26（对应界面待定，点了不跳转）
  ],
  onNav: page => openPage(page),
  face6: css.getPropertyValue('--face').trim(),
  face5: css.getPropertyValue('--face-5').trim(),
  edge: '#8f8a7e'
});

/* ================= 球面 → 各页 ================= */
const home = document.getElementById('home');
const screens = {};
document.querySelectorAll('.screen[id^="page-"]').forEach(s => screens[s.id] = s);

function closeAll() {
  Object.values(screens).forEach(s => s.classList.remove('open'));
}
function openPage(page) {
  closeAll();
  home.classList.add('away');
  const p = screens['page-' + page];
  p.classList.add('open');
  p.scrollTop = 0;
}
function goHome() {
  closeAll();
  home.classList.remove('away');
}
// 各页返回按钮 → 主界面
document.querySelectorAll('[data-home]').forEach(b =>
  b.addEventListener('click', goHome));
// 四角常驻入口
document.querySelectorAll('.corner').forEach(a =>
  a.addEventListener('click', e => { e.stopPropagation(); openPage(a.dataset.corner); }));
// Esc 回主界面
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') goHome();
});
</script>
